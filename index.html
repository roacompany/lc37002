<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PDF를 편집 가능한 PowerPoint(PPTX)로 변환합니다. 파일은 브라우저 밖으로 업로드되지 않습니다." />
    <title>PDF → PPT 변환기</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23d24726%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3EP%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>PDF → PPT 변환기</h1>
        <p class="sub">PDF를 PowerPoint(.pptx)로 변환합니다. 모든 처리는 브라우저 안에서 이루어지며 파일이 서버로 전송되지 않습니다.</p>
      </header>

      <label id="drop" class="drop" for="file">
        <input id="file" type="file" accept="application/pdf,.pdf" hidden />
        <strong>PDF 파일을 여기에 끌어다 놓거나 클릭해서 선택하세요</strong>
        <span id="file-info" class="muted">선택된 파일 없음</span>
      </label>

      <section class="options" aria-label="변환 옵션">
        <fieldset>
          <legend>변환 방식</legend>
          <label class="choice">
            <input type="radio" name="mode" value="editable" checked />
            <span>
              <b>편집 가능</b>
              <small>원본 모양을 배경으로 유지하고, 텍스트는 위치·크기·색상을 맞춘 편집 가능한 텍스트 상자로 변환</small>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="image" />
            <span>
              <b>원본 그대로</b>
              <small>각 페이지를 고해상도 이미지로 넣어 모양이 100% 동일 (텍스트 편집 불가)</small>
            </span>
          </label>
        </fieldset>

        <div class="row">
          <label>
            해상도
            <select id="scale">
              <option value="1.5">보통 (108 dpi)</option>
              <option value="2.5" selected>높음 (180 dpi)</option>
              <option value="4">최고 (288 dpi)</option>
            </select>
          </label>
          <label>
            이미지 형식
            <select id="format">
              <option value="jpeg" selected>JPEG (작은 파일)</option>
              <option value="png">PNG (무손실)</option>
            </select>
          </label>
          <label>
            페이지 범위
            <input id="range" type="text" placeholder="전체 (예: 1-3, 5)" />
          </label>
          <label>
            글자 인식 (OCR)
            <select id="ocr">
              <option value="auto" selected>스캔 페이지만</option>
              <option value="all">모든 페이지 (이미지 속 글자 포함)</option>
              <option value="off">사용 안 함</option>
            </select>
          </label>
          <label class="check">
            <input id="links" type="checkbox" checked />
            링크 유지
          </label>
        </div>
      </section>

      <div class="actions">
        <button id="convert" disabled>PPTX로 변환</button>
        <button id="cancel" class="secondary" hidden>취소</button>
      </div>

      <div id="progress" class="progress" hidden>
        <div class="bar"><div id="bar-fill"></div></div>
        <span id="progress-text"></span>
      </div>
      <p id="message" role="status"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
